spring.application.name=achados-perdidos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/achados_perdidos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Flyway versiona o schema; o Hibernate apenas valida os mapeamentos.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.item.dias-expiracao=${ITEM_DIAS_EXPIRACAO:90}

server.error.include-message=never
