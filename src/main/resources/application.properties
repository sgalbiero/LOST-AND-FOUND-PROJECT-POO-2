spring.application.name=achados-perdidos

# Carrega credenciais locais do arquivo .env, que e ignorado pelo Git.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/achados_perdidos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Flyway versiona o schema; o Hibernate apenas valida os mapeamentos.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.item.dias-expiracao=${ITEM_DIAS_EXPIRACAO:90}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Administrador}
app.security.auth-rate-limit=${AUTH_RATE_LIMIT:20}
app.security.require-https=${REQUIRE_HTTPS:false}

# Necessário quando HTTPS termina no reverse proxy. O proxy deve remover cabeçalhos
# Forwarded enviados pelo cliente e inserir os valores confiáveis.
server.forward-headers-strategy=framework

server.error.include-message=never
