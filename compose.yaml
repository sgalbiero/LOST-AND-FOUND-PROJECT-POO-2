services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: achados_perdidos
      POSTGRES_USER: ${POSTGRES_USER:-achados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/achados_perdidos
      DB_USERNAME: ${POSTGRES_USER:-achados}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?Configure APP_ADMIN_EMAIL no arquivo .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Configure APP_ADMIN_PASSWORD no arquivo .env}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Equipe de apoio}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    profiles: ["https"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
